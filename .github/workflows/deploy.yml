name: Auto-Deploy (Cloudflare Workers + tgcloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ai-radar
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets."
            exit 1
          fi
          npx wrangler deploy

  deploy-tgcloud:
    name: Deploy to tgcloud (Optional Mini App)
    needs: check
    if: hashFiles('tgcloud.jsonc') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tgcloud CLI
        run: npm install -g @tgcloud/cli
      - name: Push Mini App & Serverless Endpoints
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [[ -z "$TGCLOUD_TOKEN" ]]; then
            echo "::error::Set TGCLOUD_TOKEN in GitHub Repository Secrets."
            exit 1
          fi
          NO_COLOR=1 tgcloud --no-pager push --force
